# Meridian 0.7.0-pre.5.1: the last 0.7 pre-release before the release, frozen. Protocol build 251 /
# CRC 2982205573 (unsigned uint32). The 0.7.0 release changed the protocol (build 258), so this exact
# recipe pins the pre-release to meridian-protocol line/0.7.0-pre.5.1; everything else builds as for 0.7.X.
#
#   <name>  <source>  [branch]  — the BRANCH column decides how the source is used:
#     meridian-xray   git@github.com:hyspy-dev/meridian-xray.git   main   # git URL + branch: clone into checkouts/, fetch, checkout main
#     meridian-xray   git@github.com:hyspy-dev/meridian-xray.git          # git URL, no branch: follows origin/HEAD (the repo's default branch)
#     my-mod          ../my-mod                                    dev    # LOCAL repo + branch: clone into checkouts/ at 'dev' (your uncommitted edits are dropped)
#     my-mod          ../my-mod                                           # LOCAL path, no branch: build the folder AS-IS, git untouched (use while developing)
#   local paths are absolute or relative to this umbrella dir.
crc 2982205573

