#     my-mod          ../my-mod                                    dev    # LOCAL repo + branch: clone into checkouts/ at 'dev' (your uncommitted edits are dropped)
#     my-mod          ../my-mod                                           # LOCAL path, no branch: build the folder AS-IS, git untouched (use while developing)
#   local paths are absolute or relative to this umbrella dir.
